name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smsplatform
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smsplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsplatform"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://smsplatform:ci@localhost:5432/smsplatform?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: Araçları kur
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install github.com/pressly/goose/v3/cmd/goose@latest

      # sqlc üretimi güncel mi: queries/*.sql değişip 'make gen' unutulmuşsa
      # kod eski SQL'i çalıştırır. Bu sessiz bir hata olurdu.
      - name: sqlc üretimi güncel mi
        working-directory: api
        run: sqlc diff

      - name: Statik analiz
        working-directory: api
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Derleme
        working-directory: api
        run: go build ./...

      # Birim testler ortam değişkeninden BAĞIMSIZ olmalı. DATABASE_URL burada
      # tanımlı olduğu halde config testleri geçmeli — aksi halde testler
      # ortama sızıntı yapıyor demektir.
      - name: Birim testler
        working-directory: api
        run: go test ./... -race -count=1

      - name: Şema
        working-directory: api
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Entegrasyon testleri
        working-directory: api
        run: go test -tags=integration ./... -race -count=1

      - name: Kapsam (domain >= %90)
        working-directory: api
        run: |
          go test ./internal/domain/... -coverprofile=cov.out -covermode=atomic
          PCT=$(go tool cover -func=cov.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "domain kapsamı: %$PCT"
          awk -v p="$PCT" 'BEGIN { exit (p+0 >= 90) ? 0 : 1 }' || {
            echo "::error::domain kapsamı %90'ın altında (%$PCT)"; exit 1; }

      - name: Duman testi (uçtan uca)
        run: |
          cp .env.example .env
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "WEBHOOK_HEROSMS_SECRET=$(openssl rand -hex 16)"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "HTTP_ADDR=:8091"
          } >> .env
          ./scripts/smoke-auth.sh
