name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smsplatform
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smsplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsplatform"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://smsplatform:ci@localhost:5432/smsplatform?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: Araçları kur
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install github.com/pressly/goose/v3/cmd/goose@latest

      # sqlc üretimi güncel mi: queries/*.sql değişip 'make gen' unutulmuşsa
      # kod eski SQL'i çalıştırır. Bu sessiz bir hata olurdu.
      - name: sqlc üretimi güncel mi
        working-directory: api
        run: sqlc diff

      # Bir yorum garanti veriyorsa ("asla", "reddedilir", "log'larız"),
      # o garantiyi doğrulayan bir test referansı taşımalı. Kod incelemesinde
      # beş yerde yorumun kodun sağlamadığı bir söz verdiği bulundu.
      - name: Garanti yorumları teste bağlı mı
        run: python3 scripts/check-guarantees.py

      - name: Statik analiz
        working-directory: api
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Derleme
        working-directory: api
        run: go build ./...

      # Birim testler ortam değişkeninden BAĞIMSIZ olmalı. DATABASE_URL burada
      # tanımlı olduğu halde config testleri geçmeli — aksi halde testler
      # ortama sızıntı yapıyor demektir.
      - name: Birim testler
        working-directory: api
        run: go test ./... -race -count=1

      - name: Şema
        working-directory: api
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Entegrasyon testleri
        working-directory: api
        run: go test -tags=integration -p 1 ./... -race -count=1

      - name: Kapsam (domain >= %90)
        working-directory: api
        run: |
          go test ./internal/domain/... -coverprofile=cov.out -covermode=atomic
          PCT=$(go tool cover -func=cov.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "domain kapsamı: %$PCT"
          awk -v p="$PCT" 'BEGIN { exit (p+0 >= 90) ? 0 : 1 }' || {
            echo "::error::domain kapsamı %90'ın altında (%$PCT)"; exit 1; }

      - name: Duman testi (uçtan uca)
        run: |
          cp .env.example .env
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "WEBHOOK_HEROSMS_SECRET=$(openssl rand -hex 16)"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "HTTP_ADDR=:8091"
          } >> .env
          ./scripts/smoke-auth.sh

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` — `npm install` DEĞİL. install kilit dosyasını sessizce
      # güncelleyebilir; o zaman CI, geliştiricinin makinesindekinden farklı
      # sürümleri derler ve "bende çalışıyordu" hataları CI'da görünmez olur.
      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      # Tip denetimi derlemeden AYRI koşar: Next derlemesi tip hatalarını
      # atlayabilir (ignoreBuildErrors kapalı olsa bile bazı yollar analiz
      # dışı kalır), tsc tümünü görür.
      - name: Tip denetimi
        working-directory: web
        run: npx tsc --noEmit

      - name: Derleme
        working-directory: web
        # Derleme zamanı gereken NEXT_PUBLIC_* değişkenleri BUILD'E GÖMÜLÜR.
        # CI'da gerçek değer verilmez; yer tutucular derlemenin geçtiğini
        # doğrulamaya yeter.
        env:
          NEXT_PUBLIC_SITE_URL: https://ornek.test
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ''
        run: npm run build

  guvenlik:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      # govulncheck ÇAĞRI GRAFİĞİNE bakar: yalnız gerçekten ulaşılabilen
      # açıkları bildirir. Bu yüzden "bağımlılıkta açık var ama biz o kodu
      # çağırmıyoruz" gürültüsü üretmez ve bulduğu her şey gerçektir.
      - name: govulncheck (Go)
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      # SERT KAPI yalnız ÜRETİME ÇIKAN bağımlılıklar için (--omit=dev).
      # Geliştirme bağımlılıklarındaki bir açık kullanıcıyı etkilemez ama
      # her yükseltmede tüm işi durdurur; o kapının arkasında insan kalmaz,
      # gürültü olur ve gerçek uyarılar da yok sayılmaya başlanır.
      - name: npm audit — üretim bağımlılıkları (kapı)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      # Geliştirme bağımlılıkları GÖRÜNÜR olsun ama işi durdurmasın.
      - name: npm audit — tümü (bilgi)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=moderate

  imajlar:
    name: Üretim imajları derleniyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dağıtım dosyaları kod gibi çürür: go.mod'daki sürüm yükselir,
      # Dockerfile'daki taban imaj eskir ve bu YALNIZ dağıtım gününde
      # fark edilir. Bu iş onu her PR'da fark eder.
      - name: API imajı
        run: docker build -f deploy/Dockerfile.api -t onay360-api:ci .

      - name: Web imajı
        run: |
          docker build -f deploy/Dockerfile.web \
            --build-arg NEXT_PUBLIC_SITE_URL=https://ornek.test \
            -t onay360-web:ci .

      # Compose dosyası `.env`'deki değişkenleri ikame eder ve zorunlu
      # olanları `${VAR:?}` ile işaretler. Depoda .env YOKTUR (ve olmamalı),
      # örnek dosyadaki yer tutucular da BOŞTUR — bu yüzden burada yalnız
      # SÖZDİZİM doğrulaması için sahte değerler üretiriz.
      # 🔴 Bunlar gerçek sır değildir ve hiçbir yere yazılmaz.
      - name: Compose sözdizimi
        run: |
          cat > deploy/.env <<'EOF'
          DOMAIN=ornek.test
          ACME_EMAIL=ci@ornek.test
          NEXT_PUBLIC_SITE_URL=https://ornek.test
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-sahte
          POSTGRES_DB=ci
          REDIS_PASSWORD=ci-sahte
          IMAGE_TAG=ci
          EOF
          docker compose -f deploy/docker-compose.prod.yml config >/dev/null
          rm -f deploy/.env
